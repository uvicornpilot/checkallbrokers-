{% extends "admin/base_site.html" %}

{% block content %}
  <h1>{{ title }}</h1>
  <form method="post">{% csrf_token %}
    <div>
      {{ form.scheduled_at.label_tag }} {{ form.scheduled_at }}
    </div>
    <input type="hidden" name="action" value="{{ action }}">
    <input type="hidden" name="select_across" value="0">
    {% for obj in queryset %}
      <input type="hidden" name="_selected_action" value="{{ obj.pk }}">
    {% endfor %}
    <button type="submit" name="apply" class="default">Підтвердити</button>
    <a href="javascript:history.back()">Скасувати</a>
  </form>
{% endblock %}
