services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8003:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - /home/checkallbrokers-/media:/app/media
      - /home/checkallbrokers-/static:/app/staticfiles

  scheduler:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    entrypoint: >
      sh -c "while true; do
        python manage.py publish_scheduled_pages;
        sleep 60;
      done"

volumes:
  postgres_data:
